name: NA data

# 0.53.0-beta: keeps the page's NA servant and Craft Essence data up to date by itself.
# Every three days it asks Atlas Academy whether NA's data changed (a tiny info.json; a run that finds nothing takes
# seconds). When it did, tools/fetch_na.py downloads it, tools/gen_atlas.py and tools/build.py rebuild the page, and:
#   - on main: the result goes to the branch na-data and a pull request into main (one, kept up to date) to merge;
#   - on any other branch: after a push of tools/fetch_na.py it's committed to that branch; a push of this file
#     alone is a test run that commits nothing;
#   then the tests run on it (tools/bot_commit.sh). It never pushes to main. tools/check_data.py stops it if the new
#   data lost servants or Craft Essences (a partial export), and tools/build.py if the data could break the page.
# Nothing is committed when the page's data comes out the same. Servants NA has now leave data/atlas/upcoming.json,
# so their pages use NA's own text from then on.
# It can also be run from the Actions tab ("Run workflow"). GitHub turns off schedules in a public repo after 60 days
# without a commit; "Run workflow" turns this one on again.
on:
  schedule:
    # 22 Nov 2026, Noyr: every three days (every four hours before), since each update of the pull request needs his
    # approval click (tools/bot_commit.sh); a scheduled Claude task reminds him. 16:23 UTC (17:23 in Amsterdam, 18:23
    # in summer) on the 1st, 4th, … 28th; from the 28th to the next 1st it's three or four days (one or two after
    # February). "*/3" would also run on the 31st, a day before the 1st.
    - cron: "23 16 1,4,7,10,13,16,19,22,25,28 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Download even if NA's data looks unchanged"
        type: boolean
        default: false
  push:
    branches-ignore: [main, na-data]
    paths: [tools/fetch_na.py, .github/workflows/na-data.yml]

permissions:
  contents: write
  pull-requests: write
  actions: write # to start the tests on what it pushes (tools/bot_commit.sh)

# one queue for both data jobs on a branch: each rebuilds the page, so they mustn't push at the same time; each checks
# out the branch as it is when it starts, so it builds on what the other one pushed
concurrency:
  group: data-jobs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download NA's data if it changed
        id: fetch
        # a push of this file is its first run on that branch: always download
        run: python tools/fetch_na.py ${{ (inputs.force || github.event_name == 'push') && '--force' || '' }}

      - name: Rebuild the page
        if: steps.fetch.outputs.changed == 'true'
        run: |
          cp src/data/atlas_data.js /tmp/atlas_data_before.js
          python tools/gen_atlas.py
          python tools/check_data.py /tmp/atlas_data_before.js
          python tools/build.py
          python tools/build.py --check
          python tools/fetch_na.py --summary /tmp/atlas_data_before.js

      - name: Commit, or open the pull request
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # on main, a pull request only when the page's data changed; on another branch, the downloaded files too
          if git diff --quiet -- src/data/atlas_data.js; then
            if [ "$GITHUB_REF_NAME" = "main" ] || [ -z "$(git status --porcelain -- data/atlas)" ]; then
              echo "The page's data came out the same: nothing to commit." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # 22 Nov 2026: on another branch, a push that leaves tools/fetch_na.py as it was (one changing only this file) is
          # a test run: it downloads and rebuilds, and commits nothing. A commit from this job holds that branch's pull
          # request until someone approves its tests (GitHub, since June 2026), so it commits only when the branch
          # changed what's downloaded. "Run workflow" on a branch still commits.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! jq -e '[.commits[]? | (.added + .modified)[]] | index("tools/fetch_na.py")' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "A test run on $GITHUB_REF_NAME: this push didn't change tools/fetch_na.py, so NA's data was downloaded and built, and nothing is committed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { echo "NA data: $(date -u +'%d %b %Y') (tools/fetch_na.py)"; echo; cat na_summary.md; } > /tmp/na_msg.txt
          { cat na_summary.md; echo; echo "Data only, made by the NA data job (.github/workflows/na-data.yml) from Atlas Academy's NA export. It's rebuilt on top of main whenever NA's data changes again, until it's merged. The version isn't changed: that's yours to decide when you release."; echo; echo "**To merge it:** GitHub holds the tests on a pull request from the bot until someone with write access approves them. Click **Awaiting approval** (top right), then **Approve workflows to run**. It merges itself once the tests pass. Each time the job updates it, it needs that click again. (The job also starts a test run by itself, under Actions → Build and test, for a quick result; GitHub doesn't count that one for the merge.)"; } > /tmp/na_body.md
          cat na_summary.md >> "$GITHUB_STEP_SUMMARY"
          tools/bot_commit.sh na-data "NA data: $(date -u +'%d %b %Y')" /tmp/na_msg.txt /tmp/na_body.md data/atlas src/data/atlas_data.js dist site

      # 22 Nov 2026: a heartbeat that can be read without GitHub's API (git ls-remote / git fetch origin bot-status), for
      # the daily security check, which can't see the Actions tab: the branch bot-status holds a single commit with
      # status.json, saying when this job last ran on main and how it went. That tells "Atlas Academy had nothing new"
      # apart from "the job is broken" (as it was for two days from 20 Nov, when every push was refused). The branch is
      # replaced each run; nothing runs on it, and it never touches main.
      - name: Leave a status for the daily check
        if: always() && github.ref == 'refs/heads/main'
        env:
          RESULT: ${{ job.status }}
          CHANGED: ${{ steps.fetch.outputs.changed }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          na=$(python3 -c "import json; print(json.load(open('data/atlas/na_info.json')).get('timestamp') or 0)" 2>/dev/null || echo 0)
          json=$(printf '{"run_at": "%s", "result": "%s", "changed": "%s", "na_timestamp": %s, "run": "%s", "schedule": "every three days: the 1st, 4th, ... 28th at 16:23 UTC"}' "$(date -u +%FT%TZ)" "$RESULT" "${CHANGED:-}" "$na" "$RUN")
          blob=$(printf '%s\n' "$json" | git hash-object -w --stdin)
          tree=$(printf '100644 blob %s\tstatus.json\n' "$blob" | git mktree)
          commit=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit-tree "$tree" -m "NA data job on main: $RESULT, $(date -u +'%d %b %Y %H:%M UTC')")
          git push -q -f origin "$commit:refs/heads/bot-status" || echo "::warning::Couldn't update the branch bot-status (the daily check reads it)."
          echo "$json"
