<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- For tests/run.py with ci-fonts: hides Inter, so sans-serif falls back to DejaVu Sans as on GitHub's Ubuntu runners -->
<fontconfig>
  <selectfont><rejectfont><pattern><patelt name="family"><string>Inter</string></patelt></pattern><pattern><patelt name="family"><string>Inter Display</string></patelt></pattern></rejectfont></selectfont>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
